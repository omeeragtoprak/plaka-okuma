__version__: 2.0.8
transform:
  __class_fullname__: Compose
  additional_targets: {}
  bbox_params: null
  is_check_shapes: true
  keypoint_params: null
  p: 1.0
  transforms:
  - __class_fullname__: Affine
    balanced_scale: false
    border_mode: 0
    fill: 0.0
    fill_mask: 0.0
    fit_output: false
    interpolation: 1
    keep_ratio: false
    mask_interpolation: 0
    p: 0.65
    rotate:
    - -12.0
    - 12.0
    rotate_method: largest_box
    scale:
      x:
      - 0.8
      - 1.1
      y:
      - 0.8
      - 1.1
    shear:
      x:
      - -12.0
      - 12.0
      y:
      - -12.0
      - 12.0
    translate_percent:
      x:
      - -0.02
      - 0.02
      y:
      - -0.02
      - 0.02
    translate_px: null
  - __class_fullname__: Perspective
    border_mode: 0
    fill: 0.0
    fill_mask: 0.0
    fit_output: false
    interpolation: 1
    keep_size: true
    mask_interpolation: 0
    p: 0.3
    scale:
    - 0.02
    - 0.08
  - __class_fullname__: RandomBrightnessContrast
    brightness_by_max: true
    brightness_limit:
    - -0.4
    - 0.15
    contrast_limit:
    - -0.3
    - 0.2
    ensure_safe_range: false
    p: 0.5
  - __class_fullname__: RandomGamma
    gamma_limit:
    - 60.0
    - 140.0
    p: 0.3
  - __class_fullname__: ToGray
    method: weighted_average
    num_output_channels: 3
    p: 0.15
  - __class_fullname__: HueSaturationValue
    hue_shift_limit:
    - -8.0
    - 8.0
    p: 0.2
    sat_shift_limit:
    - -20.0
    - 20.0
    val_shift_limit:
    - -15.0
    - 15.0
  - __class_fullname__: OneOf
    p: 0.3
    transforms:
    - __class_fullname__: ISONoise
      color_shift:
      - 0.01
      - 0.05
      intensity:
      - 0.02
      - 0.08
      p: 1.0
    - __class_fullname__: GaussNoise
      mean_range:
      - 0.0
      - 0.0
      noise_scale_factor: 1.0
      p: 1.0
      per_channel: true
      std_range:
      - 0.2
      - 0.44
    - __class_fullname__: MultiplicativeNoise
      elementwise: false
      multiplier:
      - 0.9
      - 1.1
      p: 1.0
      per_channel: false
  - __class_fullname__: OneOf
    p: 0.25
    transforms:
    - __class_fullname__: MotionBlur
      allow_shifted: true
      angle_range:
      - 0.0
      - 360.0
      blur_limit:
      - 3
      - 7
      direction_range:
      - -1.0
      - 1.0
      p: 1.0
    - __class_fullname__: GaussianBlur
      blur_limit:
      - 3
      - 5
      p: 1.0
      sigma_limit:
      - 0.5
      - 3.0
  - __class_fullname__: Downscale
    interpolation_pair:
      downscale: 0
      upscale: 0
    p: 0.2
    scale_range:
    - 0.5
    - 0.9
  - __class_fullname__: ImageCompression
    compression_type: jpeg
    p: 0.2
    quality_range:
    - 45
    - 90
